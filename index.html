<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="artifact-type" content="tool">
  <meta name="design-style" content="showroom">
  <title>PLAN OS — Plan + AI + Manifest</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#006bd6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PLAN OS">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23006bd6' width='100' height='100' rx='20'/><text x='50' y='68' font-family='Arial, sans-serif' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>P</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.43.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: light;

      /* Page and surfaces (Showroom base) */
      --background: #fbfbfd;
      --surface-container-low: #f5f5f7;
      --surface-container: #e8e8ed;
      --surface-container-high: #dcdce1;
      --surface-elevated: #ffffff;
      --backdrop-scrim: rgba(29, 29, 31, 0.42);
      --device-frame-bg: #1d1d1f;
      --device-stage-bg: #eef0f4;

      /* Ink */
      --on-surface: #1d1d1f;
      --on-surface-variant: #6e6e73;

      /* Rules */
      --outline: #d2d2d7;
      --outline-variant: #e5e5ea;

      /* Accents */
      --primary: #006bd6;
      --on-primary: #ffffff;
      --primary-container: #e8f1fd;
      --on-primary-container: #0058b0;
      --secondary: #bf4800;
      --secondary-container: #fff1e8;
      --tertiary: #1d1d1f;
      --error: #d70015;
      --on-error: #ffffff;
      --error-container: #fdebec;

      /* Semantic */
      --positive: #1f7a34;
      --positive-container: #e7f6eb;
      --warning: #b25e09;
      --warning-container: #fef4e6;

      /* Focus ring */
      --focus: #006bd6;

      /* Data series */
      --data-1: #006bd6;
      --data-2: #bf4800;
      --data-3: #248a3d;
      --data-4: #8944ab;
      --data-context: #aeaeb2;

      /* 6 Life Areas Tokens */
      --area-career: #006bd6;
      --area-career-bg: #e8f1fd;
      --area-finance: #1f7a34;
      --area-finance-bg: #e7f6eb;
      --area-health: #c9342b;
      --area-health-bg: #fdeceb;
      --area-relationship: #b83280;
      --area-relationship-bg: #fcebf4;
      --area-growth: #7c3aed;
      --area-growth-bg: #f3ecfe;
      --area-lifestyle: #bf4800;
      --area-lifestyle-bg: #fff1e8;

      /* Ambient Focus Scenes */
      --scene-loft-bg: #f5f5f7;
      --scene-forest-bg: #eaf3ed;
      --scene-midnight-bg: #0e1626;
      --scene-midnight-ink: #f2ece1;
      --scene-ocean-bg: #e8f2f8;

      /* Fonts */
      --font-headline: 'Noto Sans Thai', 'Inter Tight', sans-serif;
      --font-body: 'Noto Sans Thai', 'Inter', sans-serif;
      --font-label: 'Noto Sans Thai', 'Inter', sans-serif;

      /* Type scale */
      --display-size: clamp(1.625rem, 1.35rem + 1vw, 2rem);
      --headline-size: clamp(1.2rem, 1.05rem + 0.45vw, 1.4rem);
      --subhead-size: clamp(1rem, 0.95rem + 0.2vw, 1.125rem);
      --body-size: 0.9375rem;
      --label-size: 0.75rem;

      /* Spacing scale (4pt base) */
      --space-2xs: 0.125rem;
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.25rem;
      --space-2xl: 3.5rem;

      /* Shape */
      --rounded-sm: 0.5rem;
      --rounded-md: 0.875rem;
      --rounded-lg: 1.25rem;
      --rounded: 9999px;
      --rounded-full: 9999px;

      /* Effects */
      --headline-tracking: -0.02em;
      --figure-tracking: -0.025em;
      --tile-shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.08);
      --sheet-shadow: 0 -8px 32px rgba(0, 0, 0, 0.14);
      --device-shadow: 0 24px 64px rgba(29, 29, 31, 0.16);
      --globe-ocean: #e4eef9;
      --globe-land: #c8d8ec;
      --globe-grid: rgba(0, 107, 214, 0.15);

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
      --dur-long: 380ms;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --background: #0d1016;
      --surface-container-low: #171b24;
      --surface-container: #222834;
      --surface-container-high: #2d3544;
      --surface-elevated: #1b202b;
      --backdrop-scrim: rgba(0, 0, 0, 0.65);
      --device-stage-bg: #07090d;

      --on-surface: #f5f5f7;
      --on-surface-variant: #a1a7b3;

      --outline: #384152;
      --outline-variant: #252c3a;

      --primary: #3b9eff;
      --on-primary: #061322;
      --primary-container: #162a42;
      --on-primary-container: #8dc5ff;
      --secondary: #ff8a3d;
      --secondary-container: #332013;
      --tertiary: #f5f5f7;
      --error: #ff5c66;
      --on-error: #260608;
      --error-container: #361418;

      --positive: #3fd16a;
      --positive-container: #122e1c;
      --warning: #f5a638;
      --warning-container: #33240f;

      --focus: #3b9eff;

      --area-career-bg: #15283f;
      --area-finance-bg: #122e1c;
      --area-health-bg: #361618;
      --area-relationship-bg: #341628;
      --area-growth-bg: #271a42;
      --area-lifestyle-bg: #332013;

      --globe-ocean: #122036;
      --globe-land: #243b5c;
      --globe-grid: rgba(59, 158, 255, 0.2);
      --tile-shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.32);
      --device-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
    }

    /* Base reset */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      overflow-x: clip;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.55;
      color: var(--on-surface);
      background: var(--device-stage-bg);
      -webkit-tap-highlight-color: transparent;
    }
    header { position: static !important; }
    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }
    button { cursor: pointer; }
    h1, h2, h3, h4, p { margin: 0; }

    /* Focus visibility */
    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Android PWA Outer Shell */
    .pwa-stage {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
      background: var(--device-stage-bg);
    }

    .pwa-phone {
      width: 100%;
      max-width: 430px;
      height: min(880px, calc(100vh - var(--space-lg)));
      height: min(880px, calc(100dvh - var(--space-lg)));
      background: var(--background);
      border-radius: 2.25rem;
      border: 6px solid var(--device-frame-bg);
      box-shadow: var(--device-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* App Top Header (static inside flex column) */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      background: var(--background);
      border-bottom: 1px solid var(--outline-variant);
      flex-shrink: 0;
    }
    .brand-lockup {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      min-width: 0;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: var(--rounded-sm);
      background: var(--primary);
      color: var(--on-primary);
      display: grid;
      place-items: center;
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .brand-title-wrap {
      min-width: 0;
    }
    .brand-name {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.15;
      color: var(--on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: var(--label-size);
      color: var(--on-surface-variant);
      line-height: 1.2;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      flex-shrink: 0;
    }

    .wallet-pill {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      min-height: 36px;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--rounded);
      border: 0;
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-weight: 600;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      transition: background-color var(--dur-micro) var(--ease-out);
    }
    .wallet-pill:hover { background: var(--surface-container); }

    .icon-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      border-radius: var(--rounded);
      border: 0;
      background: transparent;
      color: var(--on-surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
    }
    .icon-btn:hover {
      background: var(--surface-container-low);
      color: var(--on-surface);
    }

    /* Main Scrollable Area */
    .pwa-main {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      scroll-behavior: smooth;
    }
    .pwa-main.is-login {
      justify-content: center;
      padding: var(--space-lg);
    }

    /* Bottom Navigation Bar (Android Material 3 style) */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: var(--space-2xs);
      padding: var(--space-xs) var(--space-sm) var(--space-sm);
      background: var(--surface-elevated);
      border-top: 1px solid var(--outline-variant);
      flex-shrink: 0;
    }
    .bottom-nav.hidden { display: none; }

    .nav-item {
      min-height: 48px;
      border: 0;
      background: transparent;
      color: var(--on-surface-variant);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2xs);
      padding: var(--space-xs);
      border-radius: var(--rounded-md);
      font-size: 0.7rem;
      font-weight: 500;
      transition: color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .nav-item:hover { background: var(--surface-container-low); }
    .nav-item.active {
      color: var(--primary);
      font-weight: 600;
    }
    .nav-item.active:active { background: var(--primary-container); }
    .nav-item .nav-pill {
      padding: var(--space-2xs) var(--space-sm);
      border-radius: var(--rounded);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--dur-short) var(--ease-out);
    }
    .nav-item.active .nav-pill {
      background: var(--primary-container);
    }

    /* Showroom Tiles & Components */
    .tile {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      padding: var(--space-md);
      border: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }
    .tile-elevated {
      background: var(--surface-elevated);
      border-radius: var(--rounded-lg);
      padding: var(--space-md);
      border: 1px solid var(--outline-variant);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }
    .tile-clickable {
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
    }
    .tile-clickable:hover {
      box-shadow: var(--tile-shadow-hover);
      transform: translateY(-1px);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }
    .section-title {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: var(--subhead-size);
      letter-spacing: var(--headline-tracking);
      color: var(--on-surface);
    }
    .page-title {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: var(--headline-size);
      letter-spacing: var(--headline-tracking);
      line-height: 1.15;
      color: var(--on-surface);
    }
    .eyebrow {
      font-size: var(--label-size);
      font-weight: 600;
      color: var(--secondary);
    }
    .muted {
      color: var(--on-surface-variant);
      font-size: 0.85rem;
    }

    /* Key Figures */
    .figure-val {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: var(--display-size);
      letter-spacing: var(--figure-tracking);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: var(--on-surface);
    }
    .figure-md {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: var(--figure-tracking);
      font-variant-numeric: tabular-nums;
      color: var(--on-surface);
    }

    /* Buttons */
    .btn-primary {
      min-height: 44px;
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--rounded);
      border: 0;
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      transition: opacity var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      min-height: 44px;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--rounded);
      border: 0;
      background: var(--surface-container);
      color: var(--on-surface);
      font-weight: 500;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      transition: background-color var(--dur-micro) var(--ease-out);
    }
    .btn-secondary:hover { background: var(--surface-container-high); }

    .btn-sm {
      min-height: 36px;
      padding: var(--space-xs) var(--space-md);
      font-size: 0.8rem;
    }

    .link-more {
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
      padding: var(--space-xs) var(--space-sm);
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2xs);
      border-radius: var(--rounded);
    }
    .link-more:hover { background: var(--primary-container); }

    /* Segmented Controls & Chips */
    .segmented {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: var(--space-xs);
      background: var(--surface-container);
      padding: var(--space-xs);
      border-radius: var(--rounded);
    }
    .seg-btn {
      min-height: 36px;
      border: 0;
      border-radius: var(--rounded);
      background: transparent;
      color: var(--on-surface-variant);
      font-weight: 500;
      font-size: 0.82rem;
      padding: var(--space-xs) var(--space-sm);
      transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .seg-btn.active {
      background: var(--surface-elevated);
      color: var(--on-surface);
      font-weight: 600;
    }

    .chip-row {
      display: flex;
      gap: var(--space-xs);
      overflow-x: auto;
      padding-bottom: var(--space-2xs);
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }

    .chip {
      min-height: 36px;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded);
      border: 0;
      background: var(--surface-container-low);
      color: var(--on-surface-variant);
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
    }
    .chip.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-weight: 600;
    }

    /* Life Area Badges */
    .area-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2xs);
      padding: var(--space-2xs) var(--space-sm);
      border-radius: var(--rounded);
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .area-career { background: var(--area-career-bg); color: var(--area-career); }
    .area-finance { background: var(--area-finance-bg); color: var(--area-finance); }
    .area-health { background: var(--area-health-bg); color: var(--area-health); }
    .area-relationship { background: var(--area-relationship-bg); color: var(--area-relationship); }
    .area-growth { background: var(--area-growth-bg); color: var(--area-growth); }
    .area-lifestyle { background: var(--area-lifestyle-bg); color: var(--area-lifestyle); }

    .prio-high { background: var(--error-container); color: var(--error); }
    .prio-medium { background: var(--warning-container); color: var(--warning); }
    .prio-low { background: var(--surface-container); color: var(--on-surface-variant); }

    /* Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-sm);
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-sm);
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: var(--rounded);
      background: var(--surface-container);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: var(--rounded);
      background: var(--primary);
      transition: width var(--dur-long) var(--ease-out);
    }
    .progress-fill.positive { background: var(--positive); }
    .progress-fill.secondary { background: var(--secondary); }

    /* Task Row */
    .task-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      background: var(--surface-elevated);
      border-radius: var(--rounded-md);
      border: 1px solid var(--outline-variant);
      transition: opacity var(--dur-short) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
    }
    .task-item.done {
      opacity: 0.68;
      background: var(--surface-container-low);
    }
    .task-check {
      width: 24px;
      height: 24px;
      min-width: 24px;
      min-height: 24px;
      margin-top: var(--space-2xs);
      border-radius: var(--rounded);
      border: 2px solid var(--outline);
      background: transparent;
      color: var(--on-primary);
      display: grid;
      place-items: center;
      padding: 0;
      transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);
    }
    .task-item.done .task-check {
      background: var(--positive);
      border-color: var(--positive);
    }
    .task-check-wrap {
      min-width: 44px;
      min-height: 44px;
      margin: calc(var(--space-xs) * -1);
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      padding: 0;
    }
    .task-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .task-title {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--on-surface);
      line-height: 1.35;
    }
    .task-item.done .task-title {
      text-decoration: line-through;
      color: var(--on-surface-variant);
    }
    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-xs);
    }

    /* Form Controls */

      padding: var(--space-xs);

      height: 5px;

      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: var(--space-xs);

      min-height: 44px;
      border-radius: var(--rounded-sm);
      border: 0;
      background: var(--surface-container-low);
      color: var(--on-surface);

      font-weight: 500;
      display: flex;
      flex-direction: column;

      justify-content: center;

      color: var(--on-primary);
      font-weight: 700;

    /* ============================================================
       Persistence & Initialization (localStorage)
       ============================================================ */
    const STORAGE_KEY = 'PlanOS_state';

    function getAppState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : null;
      } catch (err) {
        console.warn('PlanOS: Failed to load state', err);
        return null;
      }
    }

    function setAppState(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.warn('PlanOS: Failed to persist state', err);
      }
    }

    function persistState() {
      setAppState(appState);
    }

    function initApp() {
      try {
        const saved = getAppState();
        if (saved && typeof saved === 'object' && saved.user) {
          appState = saved;
        }
      } catch (err) {
        console.warn('PlanOS: Failed to load state, using defaults', err);
      }

      applyTheme(appState.theme || 'light');
      renderApp();
    }

    /* ============================================================
       Utility Helpers
       ============================================================ */
    function formatBaht(num) {
      return `฿` + Number(num || 0).toLocaleString(`th-TH`);
    }

    function getAreaObj(id) {
      return LIFE_AREAS.find(a => a.id === id) || LIFE_AREAS[0];
    }

    function getPriorityObj(id) {
      return PRIORITIES.find(p => p.id === id) || PRIORITIES[1];
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute(`data-theme`, theme === `dark` ? `dark` : `light`);
    }

    function showToast(msg) {
      const toast = document.getElementById(`pwa-toast`);
      const text = document.getElementById(`pwa-toast-text`);
      if (!toast || !text) return;
      text.textContent = msg;
      toast.classList.add(`visible`);
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove(`visible`);
      }, 2800);
    }

    function awardProgress(moneyDelta, expDelta, reason) {
      appState.user.manifestMoney = Math.max(0, (appState.user.manifestMoney || 0) + moneyDelta);
      appState.user.exp = (appState.user.exp || 0) + expDelta;
      let leveledUp = false;
      while (appState.user.exp >= appState.user.expMax) {
        appState.user.exp -= appState.user.expMax;
        appState.user.level += 1;
        leveledUp = true;
      }
      if (appState.user.exp < 0) appState.user.exp = 0;

      if (leveledUp) {
        showToast(`Level Up! คุณขึ้นสู่ Level ${appState.user.level} และรับ ${formatBaht(moneyDelta)}`);
      } else if (moneyDelta > 0) {
        showToast(`${reason} · +${formatBaht(moneyDelta)} & +${expDelta} EXP`);
      } else if (moneyDelta < 0) {
        showToast(`${reason}`);
      }
    }

    function refreshIcons() {
      if (window.lucide && typeof window.lucide.createIcons === `function`) {
        window.lucide.createIcons();
      }
    }

      }
      appState.view = view;
      persistState();
      renderApp();
      const main = document.getElementById(`pwa-main`);
      if (main) main.scrollTop = 0;
    }

      persistState();
      renderApp();

      const t = appState.tasks.find(item => item.id === taskId);

      t.done = !t.done;
      if (t.done) {
        awardProgress(prio.reward, 25, `ทำ "${t.title}" สำเร็จ`);
      } else {
        awardProgress(-prio.reward, -25, `ยกเลิกสถานะเสร็จของงาน`);
      }
      persistState();
      renderApp();

    function saveTaskForm(e, existingId) {
      e.preventDefault();
      const title = document.getElementById(`task-title-input`).value.trim();
      const area = document.getElementById(`task-area-input`).value;
      const priority = document.getElementById(`task-prio-input`).value;
      const date = document.getElementById(`task-date-input`).value;
      const time = document.getElementById(`task-time-input`).value;
      const note = document.getElementById(`task-note-input`).value.trim();
      if (!title) return;

      if (existingId) {

    function toggleTimerRun() {
      if (timerState.running) {
        stopTimer();

        return;

      timerState.running = true;
      timerState.intervalId = setInterval(() => {
        if (timerState.remainingSec > 0) {
          timerState.remainingSec -= 1;
          const clock = document.getElementById(`focus-clock-readout`);
          const ring = document.getElementById(`focus-ring-progress`);
          if (clock) clock.textContent = formatClock(timerState.remainingSec);
          if (ring) {
            const circ = 2 * Math.PI * 92;
            const ratio = 1 - (timerState.remainingSec / timerState.totalSec);

    async function startAmbientAudio() {
      try {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;
        if (!audioCtx) audioCtx = new AudioCtor();
        if (audioCtx.state === `suspended`) await audioCtx.resume();

        // Pink-filtered ambient rain/wind noise
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99765 * b0 + white * 0.0990460;
          b1 = 0.96300 * b1 + white * 0.2965164;
          b2 = 0.57000 * b2 + white * 1.0526913;
          output[i] = (b0 + b1 + b2 + white * 0.1848) * 0.04;
        }
        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = buffer;
        noiseNode.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = `lowpass`;
        filter.frequency.value = 650;

        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.28;

        noiseNode.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        noiseNode.start();
      } catch (err) {
        // Ignore if blocked
      }
    }

    function stopAmbientAudio() {
      try {
        if (noiseNode) {
          noiseNode.stop();
          noiseNode.disconnect();
          noiseNode = null;
        }
      } catch (err) {}
    }

    function updateGoalProgress(goalId, delta) {
      const g = appState.goals.find(item => item.id === goalId);
      if (!g) return;
      const wasCompleted = g.completed;
      g.progress = Math.max(0, Math.min(100, g.progress + delta));
      g.completed = g.progress >= 100;
      if (g.completed && !wasCompleted) {
        awardProgress(500000, 60, `พิชิตเป้าหมาย "${g.title}" สำเร็จ!`);
      }
      persistState();
      renderApp();
    }

      s.done = !s.done;
      if (s.done) awardProgress(120000, 20, `เสร็จสิ้นขั้นตอน "${s.text}"`);
      persistState();
      renderApp();
    }

      const item = SHOP_CATALOG.find(i => i.id === itemId);

      if (appState.ownedShopIds.includes(itemId)) {
        showToast(`คุณมี ${item.name} ในจักรวาล Manifest แล้ว`);
        return;
      }
      if (appState.user.manifestMoney < item.price) {
        const diff = item.price - appState.user.manifestMoney;
        showToast(`เงิน Manifest ขาดอีก ${formatBaht(diff)} · ทำ Task เพิ่มเพื่อสะสม!`);
        return;
      }
      appState.user.manifestMoney -= item.price;
      appState.ownedShopIds.push(itemId);
      if (item.type === `trips`) selectedTripId = item.id;
      appState.manifestTab = item.type;
      persistState();
      renderApp();
      showToast(`สำเร็จ! เพิ่ม "${item.name}" เข้าสู่จักรวาล Manifest แล้ว`);

    function initManifestGlobe(ownedTrips) {
      const canvas = document.getElementById(`manifest-globe-canvas`);
      if (!canvas) return;
      const ctx = canvas.getContext(`2d`);
      if (!ctx) return;

      // Make canvas responsive - resize based on container
      const container = canvas.parentElement;
      const containerWidth = container ? container.clientWidth : canvas.width;
      const dpr = window.devicePixelRatio || 1;
      const size = Math.min(containerWidth - 32, 300);
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width = `${size}px`;
      canvas.style.height = `${size}px`;
      ctx.scale(dpr, dpr);

      const styles = getComputedStyle(document.documentElement);
      const oceanCol = styles.getPropertyValue(`--globe-ocean`).trim();
      const landCol = styles.getPropertyValue(`--globe-land`).trim();
      const gridCol = styles.getPropertyValue(`--globe-grid`).trim();
      const pinCol = styles.getPropertyValue(`--primary`).trim();
      const selCol = styles.getPropertyValue(`--secondary`).trim();

      function project(latDeg, lonDeg, r, cx, cy) {
        const lat = latDeg * Math.PI / 180;
        const lon = (lonDeg + globeRotLon) * Math.PI / 180;
        const rotLat = globeRotLat * Math.PI / 180;
        const x0 = Math.cos(lat) * Math.sin(lon);
        const y0 = Math.sin(lat);
        const z0 = Math.cos(lat) * Math.cos(lon);
        const y1 = y0 * Math.cos(rotLat) - z0 * Math.sin(rotLat);
        const z1 = y0 * Math.sin(rotLat) + z0 * Math.cos(rotLat);
        return { x: cx + r * x0, y: cy - r * y1, visible: z1 > 0, z: z1 };
      }

      // Simple stylized continent polygons (lat, lon)
      const continents = [
        [[50,-125],[60,-100],[50,-65],[25,-80],[18,-95],[32,-117]], // N America
        [[10,-75],[5,-50],[-20,-40],[-52,-68],[-20,-75]], // S America
        [[36,-10],[55,-5],[58,28],[40,35],[36,15]], // Europe
        [[35,-10],[30,32],[10,48],[-34,22],[-15,12],[12,-15]], // Africa
        [[55,40],[68,140],[35,140],[15,105],[22,70],[40,45]], // Asia
        [[-12,130],[-25,152],[-38,142],[-32,115]] // Australia
      ];

      function draw() {
        const w = size;
        const h = size;
        const cx = w / 2;
        const cy = h / 2;
        const r = Math.min(w, h) * 0.43;
        ctx.clearRect(0, 0, w, h);

        // Sphere background
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = oceanCol;
        ctx.fill();

        // Graticule meridians
        ctx.strokeStyle = gridCol;
        ctx.lineWidth = 1;
        for (let lon = -150; lon <= 180; lon += 30) {
          ctx.beginPath();
          let started = false;
          for (let lat = -85; lat <= 85; lat += 5) {
            const p = project(lat, lon, r, cx, cy);
            if (p.visible) {
              if (!started) { ctx.moveTo(p.x, p.y); started = true; }
              else ctx.lineTo(p.x, p.y);
            } else {
              started = false;
            }
          }
          ctx.stroke();
        }

        // Stylized landmasses
        ctx.fillStyle = landCol;
        continents.forEach(poly => {
          const pts = poly.map(([la, lo]) => project(la, lo, r, cx, cy));
          if (pts.some(p => p.visible)) {
            ctx.beginPath();
            pts.forEach((p, idx) => {
              const clampedX = Math.max(cx - r, Math.min(cx + r, p.x));
              const clampedY = Math.max(cy - r, Math.min(cy + r, p.y));
              if (idx === 0) ctx.moveTo(clampedX, clampedY);
              else ctx.lineTo(clampedX, clampedY);
            });
            ctx.closePath();
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            ctx.beginPath();
            pts.forEach((p, idx) => {
              if (idx === 0) ctx.moveTo(p.x, p.y);
              else ctx.lineTo(p.x, p.y);
            });
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        });

        // Owned Trip Pins
        ownedTrips.forEach(tr => {
          const p = project(tr.lat, tr.lon, r, cx, cy);
          if (p.visible) {
            const isSel = tr.id === selectedTripId;
            ctx.beginPath();
            ctx.arc(p.x, p.y, isSel ? 9 : 6, 0, Math.PI * 2);
            ctx.fillStyle = isSel ? selCol : pinCol;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x, p.y, isSel ? 3.5 : 2.5, 0, Math.PI * 2);
            ctx.fillStyle = styles.getPropertyValue(`--on-primary`).trim();
            ctx.fill();
          }
        });
      }

      draw();

      // Touch and pointer events for globe rotation
      let isDragging = false;
      let lastX = 0;
      let lastY = 0;

      const handleDown = (ev) => {
        isDragging = true;
        lastX = ev.clientX || (ev.touches && ev.touches[0].clientX);
        lastY = ev.clientY || (ev.touches && ev.touches[0].clientY);
      };

      const handleMove = (ev) => {
        if (!isDragging) return;
        const clientX = ev.clientX || (ev.touches && ev.touches[0].clientX);
        const clientY = ev.clientY || (ev.touches && ev.touches[0].clientY);
        if (!clientX || !clientY) return;
        const dx = clientX - lastX;
        const dy = clientY - lastY;
        lastX = clientX;
        lastY = clientY;
        globeRotLon += dx * 0.6;
        globeRotLat = Math.max(-55, Math.min(55, globeRotLat + dy * 0.4));
        draw();
      };

      const handleUp = () => { isDragging = false; };

      canvas.addEventListener('pointerdown', handleDown);
      canvas.addEventListener('pointermove', handleMove);
      canvas.addEventListener('pointerup', handleUp);
      canvas.addEventListener('pointerleave', handleUp);
      canvas.addEventListener('touchstart', handleDown, { passive: true });
      canvas.addEventListener('touchmove', handleMove, { passive: true });
      canvas.addEventListener('touchend', handleUp);

      // Store cleanup handlers
      canvas._globeCleanup = () => {
        canvas.removeEventListener('pointerdown', handleDown);
        canvas.removeEventListener('pointermove', handleMove);
        canvas.removeEventListener('pointerup', handleUp);
        canvas.removeEventListener('pointerleave', handleUp);
        canvas.removeEventListener('touchstart', handleDown);
        canvas.removeEventListener('touchmove', handleMove);
        canvas.removeEventListener('touchend', handleUp);
      };
    }

        { num: `01`, code: `CLARITY`, title: `ชีวิตที่มีทิศทางชัดเจนขึ้น`, desc: `มองเห็นภาพรวมของชีวิต เป้าหมาย 6 มิติ และการเดินทางสู่ความฝันอย่างกระจ่างแจ้ง`, target: `goals` },
        { num: `02`, code: `ACTION`, title: `จากความตั้งใจสู่การลงมือทำ`, desc: `แผนการที่ดีใน Plan Day และ Habits จะนำไปสู่การลงมือทำอย่างสม่ำเสมอ พร้อมรับ Manifest Money`, target: `plan` },
        { num: `03`, code: `INSIGHT`, title: `เข้าใจตัวเองมากขึ้นทุกสัปดาห์`, desc: `AI Coach ช่วยให้เห็นสไตล์การทำงานและรูปแบบชีวิต เพื่อปรับแผนให้เหมาะกับตัวเองยิ่งขึ้น`, target: `ai-coach` },
        { num: `04`, code: `FEEL GOOD`, title: `รู้สึกดีกับการเติบโต`, desc: `สัมผัสความรู้สึกที่ได้รับจากการสร้างจักรวาล Manifest ของตัวคุณเอง ตามหลัก รู้สึก → ได้รับ`, target: `manifest` }
      ];

      main.innerHTML = `
        <div>
          <div class="eyebrow">PLAN OS Guide</div>
          <h1 class="page-title">คู่มือเริ่มต้นใช้งาน</h1>
          <p class="muted">4 แกนหลักที่ทำให้ชีวิตเป็นระบบและรู้สึกดีขึ้นในทุกวัน</p>
        </div>

        ${pillars.map(p => `
          <div class="tile-elevated tile-clickable" onclick="navigateTo('${p.target}')">
            <div class="section-head">
              <span class="area-badge area-career">${p.code} · ${p.num}</span>
              <i data-lucide="arrow-right" style="width:16px;height:16px;color:var(--primary);"></i>
            </div>
            <div style="font-weight:700;font-size:0.95rem;">${p.title}</div>
            <p class="muted" style="font-size:0.84rem;">${p.desc}</p>
          </div>
        `).join(``)}
      `;
    }

    function toggleDarkTheme() {
      appState.theme = appState.theme === `dark` ? `light` : `dark`;
      applyTheme(appState.theme);
      persistState();
      renderApp();
    }

    function toggleReminders() {
      appState.user.remindersEnabled = !appState.user.remindersEnabled;
      persistState();
      renderApp();
      showToast(appState.user.remindersEnabled ? `เปิดการแจ้งเตือนตามเวลาแล้ว` : `ปิดการแจ้งเตือนแล้ว`);
    }

    function updateProfileName(e) {
      e.preventDefault();
      const el = document.getElementById(`settings-name-input`);
      if (!el) return;
      const val = el.value.trim();
      if (!val) return;
      appState.user.name = val;
      persistState();
      renderApp();
      showToast(`บันทึกชื่อผู้ใช้เรียบร้อย`);
    }

    function resetAllData(btn) {
      if (btn.dataset.armed !== `true`) {
        btn.dataset.armed = `true`;
        btn.textContent = `กดอีกครั้งเพื่อยืนยันรีเซ็ตข้อมูลทั้งหมด`;
        return;
      }
      const theme = appState.theme;
      appState = buildEmptyState(appState.user.name, appState.user.email);
      appState.theme = theme;
      persistState();
      renderApp();
      showToast(`รีเซ็ตเป็นบัญชีเริ่มต้น (Empty State + ฿10,000,000) แล้ว`);
    }

    function exportAppData() {
      const jsonStr = JSON.stringify(appState, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pheel-os-backup.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast(`ส่งออกไฟล์สำรองข้อมูลเรียบร้อย`);
    }

    function renderSettingsView(main) {
      main.innerHTML = `
        <div>
          <div class="eyebrow">Preferences</div>
          <h1 class="page-title">ตั้งค่าและบัญชีผู้ใช้</h1>
        </div>

        <form class="tile-elevated" onsubmit="updateProfileName(event)">
          <div class="section-head">
            <div>
              <div style="font-weight:700;">${appState.user.name}</div>
              <div class="muted" style="font-size:0.78rem;">${appState.user.email} · ${appState.user.plan}</div>
            </div>
            <span class="area-badge area-finance">Lv.${appState.user.level}</span>
          </div>
          <div class="form-field">
            <label class="form-label" for="settings-name-input">ชื่อที่แสดงในแอป</label>
            <div style="display:flex;gap:var(--space-xs);">
              <input class="input-ctrl" id="settings-name-input" type="text" value="${appState.user.name}" required>
              <button type="submit" class="btn-primary btn-sm">บันทึก</button>
            </div>
          </div>
        </form>

        <div class="tile-elevated">
          <div class="switch-row">
            <div>
              <div style="font-weight:600;font-size:0.9rem;">โหมดกลางคืน (Dark Mode)</div>
              <div class="muted" style="font-size:0.76rem;">ปรับหน้าจอให้สบายตายามค่ำคืน</div>
            </div>
            <button type="button" class="switch-btn ${appState.theme === `dark` ? `on` : ``}" onclick="toggleDarkTheme()" aria-label="สลับโหมดมืด">
              <span class="switch-thumb"></span>
            </button>
          </div>
          <div class="switch-row" style="border-top:1px solid var(--outline-variant);padding-top:var(--space-sm);">
            <div>
              <div style="font-weight:600;font-size:0.9rem;">การแจ้งเตือนตามเวลาที่ตั้งไว้</div>
              <div class="muted" style="font-size:0.76rem;">เตือน Task และเวลาเข้านอน</div>
            </div>
            <button type="button" class="switch-btn ${appState.user.remindersEnabled ? `on` : ``}" onclick="toggleReminders()" aria-label="เปิดปิดการแจ้งเตือน">
              <span class="switch-thumb"></span>
            </button>
          </div>
        </div>

        <div class="tile-elevated">
          <h2 class="section-title">จัดการข้อมูลส่วนตัว</h2>
          <button type="button" class="btn-secondary" onclick="loginAsDemo()">โหลดข้อมูลตัวอย่างเต็มรูปแบบ (Demo)</button>
          <button type="button" class="btn-secondary" onclick="exportAppData()">ส่งออกข้อมูลสำรอง (JSON)</button>
          <button type="button" class="btn-secondary" style="color:var(--error);" onclick="resetAllData(this)">ล้างข้อมูลทั้งหมด (เริ่มจากศูนย์)</button>
          <button type="button" class="btn-primary" style="margin-top:var(--space-xs);" onclick="logoutToLogin()">ออกจากระบบ (ไปหน้า 01-Login)</button>
        </div>

        <p class="muted" style="text-align:center;font-size:0.75rem;">
          PLAN OS PWA · ออกแบบตามข้อมูล pheel-os.com
        </p>
      `;
    }

    // Online/Offline detection
    window.addEventListener('online', () => {
      const indicator = document.getElementById('offline-indicator');
      if (indicator) indicator.classList.remove('visible');
      showToast('กลับมาออนไลน์แล้ว');
    });

    window.addEventListener('offline', () => {
      const indicator = document.getElementById('offline-indicator');
      if (indicator) indicator.classList.add('visible');
      showToast('ออฟไลน์ - ข้อมูลยังคงบันทึกได้ในเครื่อง');
    });

    // Show install banner after 30 seconds if not installed
    document.addEventListener(`DOMContentLoaded`, initApp);

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('[PWA] Service Worker registered:', registration.scope);

            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available
                  showToast('มีเวอร์ชันใหม่พร้อมใช้งาน โหลดหน้าใหม่เพื่ออัปเดต');
                }
              });
            });
          })
          .catch((error) => {
            console.log('[PWA] Service Worker registration failed:', error);
          });
      });
    }

    // Detect if running as PWA
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
      console.log('[PWA] Running as installed PWA');
      document.body.classList.add('pwa-installed');
    }
  </script>
</body>
</html>
